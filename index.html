<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-CTZN Official | Chengalpattu Command</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark text-white min-vh-100 d-flex flex-column justify-content-between p-3">
                <div>
                    <a href="#" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom border-secondary">
                        <span class="fs-4 fw-bold text-success">E-CTZN v2.0</span>
                    </a>
                    <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start mt-4" id="menu">
                        <li class="nav-item w-100 mb-2">
                            <a href="#" onclick="Engine.showSection('home')" id="link-home" class="nav-link text-white active px-2">
                                <span class="ms-1 d-none d-sm-inline">District Summary</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-2">
                            <a href="#" onclick="Engine.showSection('volunteer')" id="link-volunteer" class="nav-link text-white-50 px-2">
                                <span class="ms-1 d-none d-sm-inline">Volunteer Deployment</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-2">
                            <a href="#" onclick="Engine.showSection('task')" id="link-task" class="nav-link text-white-50 px-2">
                                <span class="ms-1 d-none d-sm-inline">SOS / Reporting</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-2">
                            <a href="#" onclick="Engine.showSection('dashboard')" id="link-dashboard" class="nav-link text-white-50 px-2">
                                <span class="ms-1 d-none d-sm-inline">Live Ops Dashboard</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="pb-4">
                    <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">TERMINAL EXIT</button>
                </div>
            </div>

            <div class="col py-4 px-5 overflow-auto h-100">
                
                <div id="homeSection" class="content-section">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                        <div>
                            <h1 class="display-6 fw-bold text-dark">Chengalpattu District, TN</h1>
                            <p class="text-muted mb-0">Unified Emergency Management Framework</p>
                        </div>
                        <span class="badge bg-success">SYSTEM ONLINE</span>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="card shadow-sm border-0 h-100 text-center py-4">
                                <div class="card-body">
                                    <h6 class="text-uppercase text-muted">Authorized Responders</h6>
                                    <h2 id="statVols" class="display-3 fw-bold text-success my-3">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card shadow-sm border-0 h-100 text-center py-4">
                                <div class="card-body">
                                    <h6 class="text-uppercase text-muted">Active Verified Missions</h6>
                                    <h2 id="statIncidents" class="display-3 fw-bold text-danger my-3">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Simple security check: redirect to login if no role is found
        window.onload = function() {
            if (!localStorage.getItem('userRole')) {
                window.location.href = "login.html";
            }
        };

        function logout() {
            localStorage.removeItem('userRole');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
